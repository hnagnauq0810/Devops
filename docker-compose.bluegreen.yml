services:
  nginx:
    image: nginx:1.27-alpine
    container_name: fastapi_nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pipeline_net
    restart: unless-stopped

  app_blue:
    image: "${IMAGE_NAME:-fastapi-devops-pipeline}:${BLUE_IMAGE_TAG:-latest}"
    container_name: fastapi_blue
    environment:
      DEPLOY_COLOR: blue
    expose:
      - "8000"
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  app_green:
    image: "${IMAGE_NAME:-fastapi-devops-pipeline}:${GREEN_IMAGE_TAG:-latest}"
    container_name: fastapi_green
    environment:
      DEPLOY_COLOR: green
    expose:
      - "8000"
    networks:
      - pipeline_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

networks:
  pipeline_net:
    name: fastapi_pipeline_net
