name: CI/CD FastAPI Docker SonarQube Blue-Green

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check app tests

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  sonarqube:
    name: SonarQube scan and quality gate
    runs-on: [self-hosted, Windows, X64]
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-xml
          path: .

      - name: Start local SonarQube on self-hosted runner
        shell: powershell
        run: docker compose -f docker-compose.sonar.yml up -d

      - name: Wait until SonarQube is ready
        shell: powershell
        run: |
          $maxAttempts = 60
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:9000/api/system/status" -TimeoutSec 5
              if ($resp.status -eq "UP") {
                Write-Host "SonarQube is UP."
                exit 0
              }
              Write-Host "SonarQube status: $($resp.status). Waiting..."
            } catch {
              Write-Host "SonarQube is not reachable yet. Waiting..."
            }
            Start-Sleep -Seconds 5
          }
          throw "SonarQube did not become ready in time."

      - name: Run SonarScanner in Docker and wait Quality Gate
        shell: powershell
        run: |
          docker run --rm `
            -e SONAR_HOST_URL="${{ secrets.SONAR_HOST_URL }}" `
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" `
            -v "${{ github.workspace }}:/usr/src" `
            -w /usr/src `
            sonarsource/sonar-scanner-cli `
            -Dsonar.qualitygate.wait=true `
            -Dsonar.qualitygate.timeout=300

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Blue-Green deploy
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR from deployment runner
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image and deploy with zero downtime
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ env.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          APP_PORT: "8080"
        run: |
          docker pull "$IMAGE_NAME:$IMAGE_TAG"
          chmod +x deploy/*.sh
          ./deploy/blue-green-deploy.sh "$IMAGE_TAG"
