name: CI/CD FastAPI Docker SonarQube Blue-Green

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: hnagnauq0810/devops

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check app tests

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  sonarqube:
    name: SonarQube scan and quality gate
    runs-on: [self-hosted, Windows, X64]
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-xml
          path: .

      - name: Start local SonarQube on self-hosted runner
        shell: powershell
        run: |
          $existing = docker ps -a --filter "name=^sonarqube$" --format "{{.Names}}"
          if ($existing -eq "sonarqube") {
            Write-Host "Found existing 'sonarqube' container. Reusing it."
            docker start sonarqube | Out-Null
          } else {
            docker compose -f docker-compose.sonar.yml up -d
          }

      - name: Wait until SonarQube is ready
        shell: powershell
        run: |
          $maxAttempts = 60
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:9000/api/system/status" -TimeoutSec 5
              if ($resp.status -eq "UP") {
                Write-Host "SonarQube is UP."
                exit 0
              }
              Write-Host "SonarQube status: $($resp.status). Waiting..."
            } catch {
              Write-Host "SonarQube is not reachable yet. Waiting..."
            }
            Start-Sleep -Seconds 5
          }
          throw "SonarQube did not become ready in time."

      - name: Run SonarScanner in Docker and wait Quality Gate
        shell: powershell
        run: |
          docker run --rm `
            --network "container:sonarqube" `
            -e SONAR_HOST_URL="http://127.0.0.1:9000" `
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" `
            -v "${{ github.workspace }}:/usr/src" `
            -w /usr/src `
            sonarsource/sonar-scanner-cli `
            --define "sonar.qualitygate.wait=true" `
            --define "sonar.qualitygate.timeout=300"

  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: sonarqube
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Blue-Green deploy
    runs-on: self-hosted
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR from deployment runner
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image and deploy with zero downtime
        shell: powershell
        env:
          IMAGE_NAME: ghcr.io/${{ env.IMAGE_NAME }}
          IMAGE_TAG: sha-${{ github.sha }}
          APP_PORT: "8080"
        run: |
          $ErrorActionPreference = "Stop"

          $composeFile = "docker-compose.bluegreen.yml"
          $stateFile = ".deploy-state"
          $activeColor = "none"
          $blueImageTag = "latest"
          $greenImageTag = "latest"

          if (Test-Path $stateFile) {
            Get-Content $stateFile | ForEach-Object {
              if ($_ -match "^([^=]+)=(.*)$") {
                $key = $matches[1]
                $value = $matches[2]
                switch ($key) {
                  "ACTIVE_COLOR" { $activeColor = $value }
                  "BLUE_IMAGE_TAG" { $blueImageTag = $value }
                  "GREEN_IMAGE_TAG" { $greenImageTag = $value }
                }
              }
            }
          }

          if ($activeColor -eq "blue") {
            $targetColor = "green"
          } else {
            $targetColor = "blue"
          }

          if ($targetColor -eq "blue") {
            $blueImageTag = $env:IMAGE_TAG
          } else {
            $greenImageTag = $env:IMAGE_TAG
          }

          $env:IMAGE_NAME = $env:IMAGE_NAME.ToLowerInvariant()
          $imageRef = "${env:IMAGE_NAME}:$($env:IMAGE_TAG)"
          Write-Host "Deploying image $imageRef to $targetColor environment"
          docker pull $imageRef
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to pull image: $imageRef"
          }

          $env:BLUE_IMAGE_TAG = $blueImageTag
          $env:GREEN_IMAGE_TAG = $greenImageTag

          $existingNginx = docker ps -a --filter "name=^fastapi_nginx$" --format "{{.Names}}"
          if ($existingNginx -eq "fastapi_nginx") {
            docker start fastapi_nginx | Out-Null
          } else {
            docker compose -f $composeFile up -d nginx
          }

          $targetContainerName = "fastapi_$targetColor"
          $existingTarget = docker ps -a --filter "name=^$targetContainerName$" --format "{{.Names}}"
          if ($existingTarget -eq $targetContainerName) {
            docker rm -f $targetContainerName | Out-Null
          }

          docker compose -f $composeFile up -d --no-deps "app_$targetColor"

          $cid = docker compose -f $composeFile ps -q "app_$targetColor"
          if ([string]::IsNullOrWhiteSpace($cid)) {
            throw "Could not find container for app_$targetColor"
          }

          Write-Host "Waiting for app_$targetColor health check..."
          for ($i = 1; $i -le 40; $i++) {
            $status = docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}" $cid
            if ($status -eq "healthy") {
              Write-Host "app_$targetColor is healthy"
              break
            }
            if ($status -eq "unhealthy") {
              docker logs $cid --tail 80
              throw "app_$targetColor became unhealthy"
            }
            Start-Sleep -Seconds 3
            if ($i -eq 40) {
              docker logs $cid --tail 80
              throw "Timed out waiting for app_$targetColor to become healthy"
            }
          }

          $upstream = "fastapi_${targetColor}:8000"
          @(
            "server {"
            "    listen 80;"
            "    server_name _;"
            ""
            "    resolver 127.0.0.11 valid=10s ipv6=off;"
            "    set `$upstream $upstream;"
            ""
            "    location / {"
            "        proxy_pass http://`$upstream;"
            "        proxy_http_version 1.1;"
            "        proxy_set_header Host `$host;"
            "        proxy_set_header X-Real-IP `$remote_addr;"
            "        proxy_set_header X-Forwarded-For `$proxy_add_x_forwarded_for;"
            "        proxy_set_header X-Forwarded-Proto `$scheme;"
            "    }"
            "}"
          ) | Set-Content -Path "deploy/nginx/default.conf"

          $nginxRunning = docker ps --filter "name=^fastapi_nginx$" --format "{{.Names}}"
          if ($nginxRunning -ne "fastapi_nginx") {
            docker start fastapi_nginx | Out-Null
          }
          docker exec fastapi_nginx nginx -s reload

          @(
            "ACTIVE_COLOR=$targetColor"
            "BLUE_IMAGE_TAG=$blueImageTag"
            "GREEN_IMAGE_TAG=$greenImageTag"
          ) | Set-Content -Path $stateFile

          Invoke-WebRequest -UseBasicParsing -Uri ("http://127.0.0.1:{0}/health" -f $env:APP_PORT) | Out-Null
          Write-Host "Deployment succeeded. Active color: $targetColor"
