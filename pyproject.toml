[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
relative_files = true
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80
